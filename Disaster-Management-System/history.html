<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ISHANA - Weather History</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">ISHANA</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="weather.html">Weather</a>
            <a href="#">Landslide Risk</a>
            <a href="history.html">History</a>
            <a href="#">Alerts</a>
        </div>

    </nav>


    <section class="history-page">

        <h1>Weather History</h1>

        <p>
            Explore historical weather patterns across
            the mountain regions of Northern India.
        </p>


        <div class="history-panel">

            <h2>Historical Weather Data</h2>

            <select id="region-select">

                <option>Select Region</option>

                <option>Himachal Pradesh</option>

                <option>Uttarakhand</option>

                <option>Jammu & Kashmir</option>

                <option>Sikkim</option>

                <option>Arunachal Pradesh</option>

            </select>


            <select id="year-select">

                <option>Select Year</option>

                <option>2025</option>
                <option>2024</option>
                <option>2023</option>
                <option>2022</option>
                <option>2021</option>

            </select>

            <button type="button" class="history-button" onclick="loadHistoricalData()">
                Load Historical Data
            </button>


            <div class="history-placeholder">

                📊

                <h3>
                    Historical Weather Analysis
                </h3>

                <p>
                    Select a region and year to explore
                    historical weather conditions.
                </p>

            </div>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const regions = {
            "Himachal Pradesh": {
                lat: 32.2432,
                lon: 77.1892
            },

            "Uttarakhand": {
                lat: 30.0668,
                lon: 79.0193
            },

            "Jammu & Kashmir": {
                lat: 34.0837,
                lon: 74.7973
            },

            "Sikkim": {
                lat: 27.5330,
                lon: 88.5122
            },

            "Arunachal Pradesh": {
                lat: 27.1004,
                lon: 93.6166
            }
        };

        let temperatureChart;
        let rainfallChart;

        async function loadHistoricalData() {
            const region = document.getElementById("region-select").value;
            const year = document.getElementById("year-select").value;

            if (!regions[region] || year === "Select Year") {
                alert("Please select a region and year.");
                return;
            }

            const lat = regions[region].lat;
            const lon = regions[region].lon;
            const startDate = year + "-01-01";
            const endDate = year + "-12-31";

            const url =
                `https://archive-api.open-meteo.com/v1/archive?` +
                `latitude=${lat}&longitude=${lon}` +
                `&start_date=${startDate}&end_date=${endDate}` +
                `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum` +
                `&timezone=auto`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Historical weather request failed");
                }

                const data = await response.json();
                console.log(data);

                document.querySelector(".history-placeholder").innerHTML = `
                    <div class="history-success">
                        <div style="font-size:45px;">📊</div>
                        <h3>${region} — ${year}</h3>
                        <p>Historical weather data successfully loaded.</p>
                        <p>📅 Days recorded: ${data.daily.time.length}</p>

                        <div class="chart-box">
                            <h3>🌡️ Temperature Trend</h3>
                            <canvas id="temperatureChart"></canvas>
                        </div>

                        <div class="chart-box">
                            <h3>🌧️ Rainfall Pattern</h3>
                            <canvas id="rainfallChart"></canvas>
                        </div>
                    </div>
                `;

                const dates = data.daily.time;
                const maxTemps = data.daily.temperature_2m_max;
                const minTemps = data.daily.temperature_2m_min;
                const rainfall = data.daily.precipitation_sum;
                const temperatureCtx = document
                    .getElementById("temperatureChart")
                    .getContext("2d");
                const rainfallCtx = document
                    .getElementById("rainfallChart")
                    .getContext("2d");

                if (temperatureChart) {
                    temperatureChart.destroy();
                }

                if (rainfallChart) {
                    rainfallChart.destroy();
                }

                temperatureChart = new Chart(temperatureCtx, {
                    type: "line",
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Maximum Temperature (°C)",
                                data: maxTemps,
                                tension: 0.3,
                                borderWidth: 2
                            },
                            {
                                label: "Minimum Temperature (°C)",
                                data: minTemps,
                                tension: 0.3,
                                borderWidth: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: true
                            }
                        },
                        scales: {
                            x: {
                                ticks: {
                                    maxTicksLimit: 12
                                }
                            }
                        }
                    }
                });

                rainfallChart = new Chart(rainfallCtx, {
                    type: "bar",
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Rainfall (mm)",
                                data: rainfall,
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: true
                            }
                        },
                        scales: {
                            x: {
                                ticks: {
                                    maxTicksLimit: 12
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error(error);

                document.querySelector(".history-placeholder").innerHTML = `
                    <h3>⚠️ Unable to load data</h3>
                    <p>Please try again.</p>
                `;
            }
        }
    </script>

</body>

</html>
